<style>
  :root {
    color-scheme: light;
    --table: #d4d4d1;
    --table-far: #dcdcd9;
    --table-near: #c2c2bf;
    --card: #fcfcfb;
    --card-edge: #dcdcd8;
    --ink: #1a1a1a;
    --muted: #5f5f5b;
    --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(90% 70% at 42% 40%, rgba(255,255,255,.28), rgba(255,255,255,0) 70%),
      linear-gradient(180deg, var(--table-far), var(--table) 45%, var(--table-near));
    color: var(--ink);
    font-family: var(--sans);
    padding-inline: 16px;
    box-sizing: border-box;
    display: grid;
    grid-template-rows: 1fr auto;
    min-height: 100%;
    overflow-x: hidden;
  }
  main { display: grid; justify-items: center; align-content: center; padding-block: 40px 20px; }

  .table { position: relative; width: min(620px, 100%); }

  /* ---------- the box (cut from the photograph: base + lid) ---------- */
  .box {
    position: relative;
    width: 80%;
    aspect-ratio: 500 / 360;
    cursor: pointer;
    outline: none;
    -webkit-tap-highlight-color: transparent;
  }
  .box::before { /* light comes from the left: soft shadow falls right and back */
    content: ""; position: absolute;
    left: 14%; right: -6%; top: 58%; bottom: -4%;
    background: radial-gradient(closest-side, rgba(0,0,0,.30), rgba(0,0,0,.10) 60%, rgba(0,0,0,0));
    transform: skewX(-28deg);
    filter: blur(10px);
  }
  .box img { position: absolute; inset: 0; width: 100%; height: 100%; user-select: none; -webkit-user-drag: none; pointer-events: none; }
  .lid { transition: transform .75s cubic-bezier(.3,.7,.2,1), filter .75s; transform-origin: 30% 60%; }
  .box.open .lid { transform: translate(-9%, -44%) rotate(-7deg); filter: drop-shadow(10px 24px 16px rgba(0,0,0,.28)); }
  .box:focus-visible { outline: 2px solid var(--ink); outline-offset: 8px; border-radius: 4px; }
  .box.shake { animation: shake .5s cubic-bezier(.36,.07,.19,.97); }
  @keyframes shake {
    20% { transform: translateX(-7px) rotate(-.6deg); }
    40% { transform: translateX(7px) rotate(.6deg); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(3px); }
  }

  /* ---------- the card ---------- */
  .card {
    position: relative;
    z-index: 2;
    width: 62%;
    margin: -27% 0 0 33%;
    aspect-ratio: 10 / 7;
    border-radius: 4.5% / 6.4%;
    background: var(--card);
    border: 1px solid var(--card-edge);
    box-shadow: 0 1px 0 #e9e9e6, 0 2px 0 #d9d9d5, 0 3px 0 #ececea, 0 4px 0 #d4d4d0, 0 18px 22px -10px rgba(0,0,0,.35);
    display: grid;
    place-items: center;
    padding: 8% 12%;
    box-sizing: border-box;
    text-align: center;
    transform: perspective(1000px) rotateX(38deg) rotate(-5deg);
    transform-origin: 50% 100%;
  }
  .card[hidden] { display: none !important; }
  .card.rise { animation: rise 1.1s cubic-bezier(.2,.75,.25,1) both; }
  @keyframes rise {
    0%   { transform: perspective(1000px) translate(-40%, -70%) rotateX(52deg) rotate(-3deg) scale(.8); opacity: 0; }
    20%  { opacity: 1; }
    50%  { transform: perspective(1000px) translate(-22%, -95%) rotateX(20deg) rotate(-8deg) scale(.9); }
    100% { transform: perspective(1000px) rotateX(38deg) rotate(-5deg); opacity: 1; }
  }
  .text {
    font-size: clamp(12px, 3vw, 16px);
    line-height: 1.4;
    letter-spacing: .005em;
    white-space: pre-line;
    text-wrap: balance;
    max-width: 30ch;
  }

  .note {
    min-height: 1.5em;
    margin: 34px 0 0;
    font-size: 13px;
    line-height: 1.5;
    color: var(--muted);
    text-align: center;
    text-wrap: balance;
  }
  .note strong { color: var(--ink); font-weight: 500; }
  .credit {
    margin: 0;
    padding-block: 12px max(16px, env(safe-area-inset-bottom));
    font-size: 12px;
    text-align: right;
    color: var(--ink);
    opacity: .4;
    transition: opacity .2s;
  }
  .credit:hover, .credit:focus-within { opacity: .8; }
  .credit a { color: inherit; text-decoration: none; }
  @media (prefers-reduced-motion: reduce) {
    .lid { transition: none; }
    .card.rise { animation: fade .3s both; }
    .box.shake { animation: none; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  }
</style>

<script>
const CARDS = ["Remove specifics and convert to ambiguities", "Think of the radio", "Don't be frightened of clichés", "Allow an easement (an easement is the abandonment of a stricture)", "What is the reality of the situation?", "Simple subtraction", "Are there sections? Consider transitions", "Turn it upside down", "Go slowly all the way round the outside", "A line has two sides", "Infinitesimal gradations", "Make an exhaustive list of everything you might do and do the last thing on the list", "Change instrument roles", "Into the impossible", "Accretion", "Ask people to work against their better judgment", "Disconnect from desire", "Take away the elements in order of apparent non-importance", "Emphasize repetitions", "Don't be afraid of things because they're easy to do", "Is there something missing?", "Don't be frightened to display your talents", "Use unqualified people", "Breathe more deeply", "How would you have done it?", "Honor thy error as a hidden intention", "Emphasize differences", "Only one element of each kind", "Do nothing for as long as possible", "Bridges\n-build\n-burn", "Water", "You don't have to be ashamed of using your own ideas", "Make a sudden, destructive unpredictable action; incorporate", "Tidy up", "Consult other sources", "Do the words need changing?", "Use an unacceptable color", "Ask your body", "Humanize something free of error", "Use filters", "Balance the consistency principle with the inconsistency principle", "Fill every beat with something", "Discard an axiom", "Listen to the quiet voice", "What wouldn't you do?", "Is it finished?", "Decorate, decorate", "Put in earplugs", "Give the game away", "Reverse", "Abandon normal instruments", "Trust in the you of now", "Use fewer notes", "What would your closest friend do?", "Repetition is a form of change", "Distorting time", "Give way to your worst impulse", "Make a blank valuable by putting it in an exquisite frame", "The inconsistency principle", "Ghost echoes", "Don't break the silence", "You can only make one dot at a time", "Discover the recipes you are using and abandon them", "Just carry on", "Cascades", "(Organic) machinery", "Courage!", "What mistakes did you make last time?", "You are an engineer", "Consider different fading systems", "Remove ambiguities and convert to specifics", "Mute and continue", "Look at the order in which you do things", "It is quite possible (after all)", "Go outside. Shut the door.", "Don't stress one thing more than another", "Do we need holes?", "Cluster analysis", "Work at a different speed", "Do something boring", "Look closely at the most embarrassing details and amplify them", "Define an area as ‘safe’ and use it as an anchor", "Mechanicalize something idiosyncratic", "Overtly resist change", "Emphasize the flaws", "Accept advice", "Remember those quiet evenings", "Take a break", "The tape is now the music", "Short circuit (example; a man eating peas with the idea that they will improve his virility shovels them straight into his lap)", "Imagine the music as a moving chain or caterpillar", "Use an old idea", "Intentions\n-credibility of\n-nobility of\n-humility of", "Destroy\n-nothing\n-the most important thing", "Imagine the music as a set of disconnected events", "Change nothing and continue with immaculate consistency", "Imagine the piece as a set of disconnected events", "What are you really thinking about just now? Incorporate.", "Children's voices\n-speaking\n-singing", "Assemble some of the instruments in a group and treat the group", "Feedback recordings into an acoustic situation", "Shut the door and listen from outside", "Towards the insignificant", "Is the tuning appropriate?", "Simply a matter of work", "Look at a very small object, look at its centre", "Not building a wall but making a brick", "Revaluation (a warm feeling)", "Disciplined self-indulgence", "The most important thing is the thing most easily forgotten", "Always first steps", "Idiot glee", "Question the heroic approach", "Be extravagant", "Always give yourself credit for having more than personality", "State the problem in words as clearly as possible", "Faced with a choice, do both", "Tape your mouth", "Get your neck massaged", "Twist the spine", "Lowest common denominator check\n-single beat\n-single note\n-single riff", "Do the washing up", "Listen in total darkness, or in a very large room, very quietly", "Convert a melodic element into a rhythmic element", "Would anybody want it?", "Spectrum analysis", "Retrace your steps", "", "Go to an extreme, move back to a more comfortable place", "Once the search is in progress, something will be found", "Only a part, not the whole", "From nothing to more than nothing", "Be less critical more often"];
const KEY = "oblique-drawn";

const box = document.getElementById("box");
const card = document.getElementById("card");
const text = document.getElementById("text");
const note = document.getElementById("note");

// One card per calendar day, the same card for everyone that day.
function todayKey(d = new Date()) {
  return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
}
function dailyIndex(d = new Date()) {
  const day = Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
  return ((day * 2654435761) >>> 0) % CARDS.length;
}
function untilTomorrow() {
  const now = new Date();
  const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
  const mins = Math.ceil((next - now) / 60000);
  const h = Math.floor(mins / 60), m = mins % 60;
  return h ? h + " h " + m + " min" : m + " min";
}

function read() { try { return localStorage.getItem(KEY); } catch { return null; } }
function write(v) { try { localStorage.setItem(KEY, v); } catch {} }

let drawn = read() === todayKey();
let animating = false;

function showCard(animate) {
  const t = CARDS[dailyIndex()];
  text.textContent = t;
  card.hidden = false;
  if (animate) { card.classList.remove("rise"); void card.offsetWidth; card.classList.add("rise"); }
  const date = new Date().toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" });
  note.innerHTML = t ? "Your card for " + date + "." : "A blank card. Today, write your own.";
}

function refuse() {
  box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake");
  note.innerHTML = "<strong>Only one card a day.</strong> The box opens again in " + untilTomorrow() + ".";
}

function open() {
  if (animating) return;
  if (drawn) { refuse(); return; }
  drawn = true;
  animating = true;
  write(todayKey());
  box.classList.add("open");
  box.setAttribute("aria-label", "The box is closed until tomorrow");
  setTimeout(() => showCard(true), 550);
  setTimeout(() => { box.classList.remove("open"); animating = false; }, 1900);
}

box.addEventListener("click", open);
box.addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); }
});

// Already drew today: the card stays on the table and the box stays shut.
